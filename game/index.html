<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault — a stealth heist game</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1322; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 160vh); height: auto; aspect-ratio: 960 / 600; display: block; background: #1b2436; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="600" aria-label="Midnight Vault: sneak past guards and cameras, grab the loot and reach the exit"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
